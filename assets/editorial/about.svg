<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="283" viewBox="0 0 960 283"><defs><radialGradient id="g" cx="83%" cy="10%" r="95%"><stop stop-color="#79133f"/><stop offset=".53" stop-color="#36162d"/><stop offset="1" stop-color="#201521"/></radialGradient></defs><style>.h{font-family:Georgia,serif;fill:#fff0f4}.m,.k{font-family:monospace;fill:#ffabc9}.k{letter-spacing:2px}.b{font-family:Arial,sans-serif;fill:#ead3df}@media (prefers-reduced-motion:no-preference){.output{animation:print .42s ease both;animation-delay:var(--delay)}@keyframes print{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}.ball{animation:rally 4.2s ease-in-out infinite}@keyframes rally{0%,100%{transform:translate(0,0)}25%{transform:translate(52px,-11px)}50%{transform:translate(104px,0)}75%{transform:translate(52px,-11px)}}}</style><rect width="960" height="283" fill="#15121b"/><text x="20" y="27" class="k" font-size="15">01  /  ABOUT</text><text x="20" y="76" class="h" font-size="43">Hello, I’m Andrei.</text><path d="M20 92h917" stroke="#95516f"/><circle cx="20" cy="92" r="3" fill="#ee9dbb"/><rect x="20" y="112" width="581" height="152" rx="8" fill="#221522" stroke="#67324f"/><rect x="613" y="112" width="325" height="152" rx="8" fill="url(#g)" stroke="#67324f"/><text x="36" y="143" class="m" font-size="16">andrei@cdo  ~  $ cat about.txt</text><text x="36" y="177" class="b output" style="--delay:0.25s" font-size="20">I used to make coffee and mix drinks.</text><text x="36" y="205" class="b output" style="--delay:0.5s" font-size="20">Now I work on the database for our resto bar</text><text x="36" y="233" class="b output" style="--delay:0.75s" font-size="20">and build tools for my speedcubing sessions.</text><text x="631" y="145" class="k" font-size="15">AWAY FROM THE KEYBOARD</text><text x="631" y="185" class="h" font-size="25">Speedcubing</text><text x="631" y="216" class="h" font-size="22">Table tennis · Pickleball</text><path d="M632 250h122m-61-7v7" fill="none" stroke="#995972"/><circle class="ball" cx="640" cy="246" r="3.5" fill="#ffb4d1"/></svg>